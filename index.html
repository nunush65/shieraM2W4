<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">
    <title>weather</title>
</head>


<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <main class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-6">

        <h1 class="text-3xl font-bold text-center text-slate-800 mb-6">
            Weather Dashboard
        </h1>

        <form id="searchForm" class="flex gap-2 mb-6">
            <input
                id="city-input"
                type="text"
                placeholder="Search city..."
                class="flex-1 px-4 py-3 border border-slate-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button
                id="search-btn"
                type="submit"
                class="px-5 py-3 bg-blue-600 text-white font-medium
                       rounded-lg hover:bg-blue-700 transition"
            >
                Search
            </button>
        </form>

        <div id="todayWeather"></div>

        <ul id="forecast-list" class="mt-4 space-y-3"></ul>

    </main>

    <script type="module" src="./js/app.js"></script>
</body>


</html>
